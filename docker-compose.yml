version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hackbuddy-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hackbuddy
    ports:
      - "5434:5432" # Maps your computer's port 5434 to the container's 5432
    volumes:
      - hackbuddy_pgdata_v16:/var/lib/postgresql/data # Makes sure data is not lost if the container stops
    restart: unless-stopped

volumes:
  hackbuddy_pgdata_v16:
